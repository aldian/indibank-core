name: IndiBank CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY_HOST: asia-southeast2-docker.pkg.dev

jobs:
  # =====================================================================
  # 1. Quality & Spec Verification with Strict 95% Coverage Barrier
  # =====================================================================
  test:
    name: Build & Verify 95% Coverage Barrier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Unit Tests & Verify JaCoCo Coverage (Threshold >= 95%)
        run: mvn clean test jacoco:check

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Package Spring Boot Executable JAR
        run: mvn package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: indibank-jar
          path: target/indibank-core-*.jar
          retention-days: 1

  # =====================================================================
  # 2. Ephemeral Preview Deployment (Feature Branches)
  # =====================================================================
  preview-deploy:
    name: Deploy Feature Preview (Ephemeral Environment)
    needs: test
    if: startsWith(github.ref, 'refs/heads/feature/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/indibank-repo/indibank-engine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: indibank-jar
          path: target/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: Build & Push Preview Container Image
        run: |
          PREVIEW_TAG="${{ env.IMAGE_NAME }}:preview-${{ github.sha }}"
          docker build -t "$PREVIEW_TAG" .
          docker push "$PREVIEW_TAG"
          echo "PREVIEW_IMAGE=$PREVIEW_TAG" >> $GITHUB_ENV

      - name: Connect to GKE Cluster
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Preview Environment
        run: |
          kubectl apply -f k8s/namespace.yaml
          if [ -n "${{ secrets.PROD_DOMAIN }}" ]; then
            kubectl create secret generic indibank-domains -n indibank \
              --from-literal=APP_DOMAIN="${{ secrets.PROD_DOMAIN }}" \
              --from-literal=PREVIEW_DOMAIN="${{ secrets.PREVIEW_DOMAIN }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
            kubectl create secret generic oracle-db-secret -n indibank \
              --from-literal=ORACLE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --from-literal=APP_USER_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          # Replace generic container image placeholder with target preview image
          sed -i "s|image: indibank-engine:latest|image: ${{ env.PREVIEW_IMAGE }}|g" k8s/app.yaml
          kubectl apply -f k8s/app.yaml
          if [ -n "${{ secrets.STATIC_IP }}" ]; then
            kubectl patch svc indibank-lb -n indibank -p "{\"spec\":{\"loadBalancerIP\":\"${{ secrets.STATIC_IP }}\"}}" || true
          fi
          
          # Deploy candidate image to preview pod
          kubectl set image deployment/indibank-core-preview app=${{ env.PREVIEW_IMAGE }} -n indibank
          kubectl rollout status deployment/indibank-core-preview -n indibank --timeout=180s

      - name: Report Preview URL
        run: |
          echo "### 🚀 Preview Environment Deployed!" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.PREVIEW_DOMAIN }}" ]; then
            echo "- **Preview URL**: [https://${{ secrets.PREVIEW_DOMAIN }}](https://${{ secrets.PREVIEW_DOMAIN }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =====================================================================
  # 3. Production Zero-Downtime Blue-Green Deployment (main branch)
  # =====================================================================
  production-deploy:
    name: Production Blue-Green Deploy (Zero-Downtime)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/indibank-repo/indibank-engine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: indibank-jar
          path: target/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: Build & Tag Container Image
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.IMAGE_NAME }}:latest"
          
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          echo "RELEASE_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Connect to GKE Cluster
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} \
            --zone ${{ secrets.GKE_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Execute Blue-Green Cutover
        run: |
          kubectl apply -f k8s/namespace.yaml
          if [ -n "${{ secrets.PROD_DOMAIN }}" ]; then
            kubectl create secret generic indibank-domains -n indibank \
              --from-literal=APP_DOMAIN="${{ secrets.PROD_DOMAIN }}" \
              --from-literal=PREVIEW_DOMAIN="${{ secrets.PREVIEW_DOMAIN }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
            kubectl create secret generic oracle-db-secret -n indibank \
              --from-literal=ORACLE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --from-literal=APP_USER_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          kubectl apply -f k8s/oracle.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/kafka.yaml

          # Step 1: Ensure production Service exists without clobbering active selector
          kubectl get service indibank-core -n indibank || kubectl apply -f k8s/service-prod.yaml

          # Step 2: Inject current release image into app manifests and preserve static IP
          sed -i "s|image: indibank-engine:latest|image: ${{ env.RELEASE_IMAGE }}|g" k8s/app.yaml
          kubectl apply -f k8s/app.yaml
          if [ -n "${{ secrets.STATIC_IP }}" ]; then
            kubectl patch svc indibank-lb -n indibank -p "{\"spec\":{\"loadBalancerIP\":\"${{ secrets.STATIC_IP }}\"}}" || true
          fi

          # Step 3: Identify current active slot (blue or green) from live Service
          ACTIVE_SLOT=$(kubectl get service indibank-core -n indibank -o jsonpath='{.spec.selector.slot}')
          if [ -z "$ACTIVE_SLOT" ]; then
            ACTIVE_SLOT="green"
          fi
          echo "Current Active Slot: $ACTIVE_SLOT"

          if [ "$ACTIVE_SLOT" == "blue" ]; then
            TARGET_SLOT="green"
            OLD_SLOT="blue"
          else
            TARGET_SLOT="blue"
            OLD_SLOT="green"
          fi

          echo "Target Standby Slot to Deploy: $TARGET_SLOT"

          # Step 4: Deploy candidate image to standby target slot with 2 replicas
          kubectl scale deployment/indibank-core-$TARGET_SLOT --replicas=2 -n indibank
          kubectl set image deployment/indibank-core-$TARGET_SLOT app=${{ env.RELEASE_IMAGE }} -n indibank
          kubectl rollout status deployment/indibank-core-$TARGET_SLOT -n indibank --timeout=180s

          # Step 5: Instant, atomic traffic switch (True Zero Downtime)
          kubectl patch service indibank-core -n indibank -p "{\"spec\":{\"selector\":{\"slot\":\"$TARGET_SLOT\"}}}"
          echo "Production traffic successfully cut over to $TARGET_SLOT"

          # Step 6: Update HPA target to the new active slot
          kubectl patch hpa indibank-core-hpa -n indibank -p "{\"spec\":{\"scaleTargetRef\":{\"name\":\"indibank-core-$TARGET_SLOT\"}}}" || true

          # Step 7: Graceful connection draining (20s) before decommissioning old slot
          sleep 20
          kubectl scale deployment/indibank-core-$OLD_SLOT --replicas=0 -n indibank
          echo "Scaled down former slot $OLD_SLOT"

      - name: Live Smoke Test
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -n "$PROD_URL" ]; then
            echo "Validating live production health: $PROD_URL/api/v1/accounts"
            curl -f -s "$PROD_URL/api/v1/accounts" | jq .
          else
            echo "No PROD_URL secret configured, skipping live smoke test."
          fi
