# =====================================================================
# Preview Service for test.indibank.aldianapps.com
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: indibank-core-preview
  namespace: indibank
  labels:
    app: indibank-core-preview
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: indibank-core-preview
---
# =====================================================================
# Edge Ingress Gateway (Caddy TLS with Let's Encrypt for Multi-Domain)
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: indibank
data:
  Caddyfile: |
    indibank.aldianapps.com {
        reverse_proxy indibank-core:8080 {
            lb_try_duration 5s
            lb_try_interval 250ms
        }
    }

    test.indibank.aldianapps.com {
        reverse_proxy indibank-core-preview:8080
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indibank-gateway
  namespace: indibank
  labels:
    app: indibank-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indibank-gateway
  template:
    metadata:
      labels:
        app: indibank-gateway
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: caddy-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: indibank-lb
  namespace: indibank
  labels:
    app: indibank-gateway
spec:
  type: LoadBalancer
  loadBalancerIP: "34.128.89.142"
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
  selector:
    app: indibank-gateway
