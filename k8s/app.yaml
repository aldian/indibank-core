# =====================================================================
# IndiBank Core Engine - Production Blue Deployment
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indibank-core-blue
  namespace: indibank
  labels:
    app: indibank-core
    slot: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indibank-core
      slot: blue
  template:
    metadata:
      labels:
        app: indibank-core
        slot: blue
    spec:
      containers:
        - name: app
          image: asia-southeast2-docker.pkg.dev/aldianfazrihady/indibank-repo/indibank-engine:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1"
            - name: SPRING_DATASOURCE_USERNAME
              value: "system"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "IndiBank2026!"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
